services:
  openforce:
    build: .
    container_name: openforce_crm
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/openforce.db
      - JWT_SECRET=${JWT_SECRET}
      - AUTO_SEED=false
    volumes:
      - openforce_data:/app/data
    restart: unless-stopped

volumes:
  openforce_data:
    driver: local
