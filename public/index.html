<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenForce ⚡ Modern Open-Source CRM</title>
  <meta name="description" content="A fast, free, self-hostable CRM inspired by the essential business workflows of Salesforce.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- App Layout -->
  <div id="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">⚡</div>
        <div class="brand-title">
          OpenForce
          <span class="brand-badge">MVP</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Core CRM</div>
        <a class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-view="pipeline" id="nav-pipeline">
          <span class="icon">📈</span>
          <span>Pipeline (Kanban)</span>
        </a>
        <a class="nav-item" data-view="leads" id="nav-leads">
          <span class="icon">🎯</span>
          <span>Leads</span>
        </a>
        <a class="nav-item" data-view="accounts" id="nav-accounts">
          <span class="icon">🏢</span>
          <span>Accounts</span>
        </a>
        <a class="nav-item" data-view="contacts" id="nav-contacts">
          <span class="icon">📇</span>
          <span>Contacts</span>
        </a>
        <a class="nav-item" data-view="activities" id="nav-activities">
          <span class="icon">📝</span>
          <span>Activities & Tasks</span>
        </a>

        <div class="nav-section-title" style="margin-top: 12px;">Analytics & System</div>
        <a class="nav-item" data-view="reports" id="nav-reports">
          <span class="icon">📑</span>
          <span>Sales Reports</span>
        </a>
        <a class="nav-item" data-view="settings" id="nav-settings">
          <span class="icon">⚙️</span>
          <span>Org Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card" id="user-profile-card">
          <div class="user-avatar" id="current-user-avatar">AV</div>
          <div class="user-info">
            <div class="user-name" id="current-user-name">Alex Vance</div>
            <span class="user-role-badge" id="current-user-role">Admin</span>
          </div>
          <button id="btn-logout" class="btn-logout" onclick="window.logout()" title="Sign Out" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--text-muted); font-size: 11px; margin-left: auto;">Logout</button>
        </div>
      </div>
    </aside>

    <!-- Main Section -->
    <div class="main-wrapper">
      <!-- Top App Bar -->
      <header class="top-header">
        <!-- Universal Global Search -->
        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="global-search-input" 
            class="search-input" 
            placeholder="Search leads, accounts, contacts, deals... (Cmd+K)" 
            autocomplete="off"
          />
          <div class="search-dropdown" id="search-dropdown"></div>
        </div>

        <!-- Header Actions -->
        <div class="header-actions">
          <!-- Instant Role/User Switcher for testing/evaluation -->
          <div class="demo-switcher" title="Quick Persona Switcher for evaluation">
            <span style="color: var(--text-muted); font-size: 11px;">Switch Persona:</span>
            <button class="demo-btn active" id="demo-btn-admin" onclick="window.switchDemoUser('admin')">Admin</button>
            <button class="demo-btn" id="demo-btn-rep" onclick="window.switchDemoUser('sarah')">Sales Rep</button>
            <button class="demo-btn" id="demo-btn-audit" onclick="window.switchDemoUser('auditor')">Read Only</button>
          </div>

          <!-- Quick Create Action Button -->
          <button class="btn btn-primary" id="btn-quick-create" onclick="window.openQuickCreateModal()">
            <span>+ Quick Create</span>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="content-area" id="main-content">
        <!-- Injected dynamically via app.js -->
      </main>
    </div>
  </div>

  <!-- Generic Reusable Modal Overlay -->
  <div class="modal-overlay" id="main-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Create Record</h3>
        <button class="modal-close-btn" onclick="window.closeModal()">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- Frontend Logic -->
  <script src="/js/app.js"></script>
</body>
</html>
